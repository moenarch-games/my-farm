name: Validate

# Documentation-only edits do not need build artifacts or browser validation.
on:
  pull_request:
  push:
    branches: ["main"]
    paths-ignore:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CONTEXT.md"
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  # Only superseded PR validation is canceled; main runs carry the Pages deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The shared builder identifies artifacts by source SHA. Use the last commit
  # that changed each generator's actual inputs, not every unrelated app commit.
  # Preserve the exact source and verified-receipt contract in both producers.
  resolve-farm-art-source:
    name: Resolve pinned artwork revision
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.revision.outputs.source_sha }}
      wasm_source_sha: ${{ steps.revision.outputs.wasm_source_sha }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Checkout exact source with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Classify documentation-only PRs
        id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node --test scripts/ci-docs-only.test.mjs
          docs_only=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$PR_BASE" && -n "$PR_HEAD" ]] &&
            git cat-file -e "$PR_BASE^{commit}" && git cat-file -e "$PR_HEAD^{commit}" &&
            git diff --no-renames --name-only -z "$PR_BASE...$PR_HEAD" > "$RUNNER_TEMP/changed-files";
          then
            docs_only="$(node scripts/ci-docs-only.mjs "$RUNNER_TEMP/changed-files")"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: Resolve artwork input revision
        id: revision
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          art_inputs=(
            scripts/farm-art-source.json
            scripts/build-farm-art.sh
            scripts/stage-farm-art.mjs
            scripts/verify-farm-art.mjs
          )
          source_sha="$(git log --first-parent -1 --format=%H -- "${art_inputs[@]}")"
          test -n "$source_sha"
          # Never reuse earlier assets if their generator inputs differ from this head.
          git diff --quiet "$source_sha" HEAD -- "${art_inputs[@]}"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

          # WASM compiles my_farm_core and my_farm_wasm, using the root Rust
          # manifests/lockfile and the root Bun build script. Keep toolchain
          # settings in the input closure if they are introduced later.
          wasm_inputs=(
            Cargo.toml
            Cargo.lock
            package.json
            crates/my_farm_core
            crates/my_farm_wasm
            .cargo
            rust-toolchain
            rust-toolchain.toml
          )
          wasm_source_sha="$(git log --first-parent -1 --format=%H -- "${wasm_inputs[@]}")"
          test -n "$wasm_source_sha"
          # Do not reuse a historical build if even one WASM input differs.
          git diff --quiet "$wasm_source_sha" HEAD -- "${wasm_inputs[@]}"
          echo "wasm_source_sha=$wasm_source_sha" >> "$GITHUB_OUTPUT"

  build-farm-art:
    if: needs.resolve-farm-art-source.outputs.docs_only != 'true'
    name: Build pinned Crop art
    needs: resolve-farm-art-source
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@5291d5162b128faca9dd83edba24e7342730e604
    with:
      source_sha: ${{ needs.resolve-farm-art-source.outputs.source_sha }}
      artifact_key: my-farm-crop-art-v1
      bun_version: latest
      use_environment_v1: false
      setup_command: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      build_command: bash scripts/build-farm-art.sh
      artifact_paths: apps/web/public/farm-art
      reuse_across_runs: true
      artifact_retention_days: 7
      timeout_minutes: 45

  build-wasm-demo:
    if: needs.resolve-farm-art-source.outputs.docs_only != 'true'
    name: Build or reuse WASM demo
    needs: resolve-farm-art-source
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@5291d5162b128faca9dd83edba24e7342730e604
    with:
      source_sha: ${{ needs.resolve-farm-art-source.outputs.wasm_source_sha }}
      artifact_key: my-farm-wasm-demo-v1
      bun_version: latest
      rust_toolchain: "1.96.1"
      rust_targets: wasm32-unknown-unknown
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      use_environment_v1: false
      # Use the upstream versioned binary instead of compiling this CLI on every build.
      # SHA-256 is the digest published for the official v0.15.0 Linux x86_64 asset.
      setup_command: |
        set -euo pipefail
        archive="$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz"
        curl --fail --silent --show-error --location --retry 3 \
          https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
          --output "$archive"
        printf '%s  %s\n' \
          'c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a' "$archive" \
          | sha256sum --check -
        tar -xzf "$archive" -C "$RUNNER_TEMP" \
          wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack
        install -Dm755 "$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack" \
          "$HOME/.cargo/bin/wasm-pack"
        test "$(wasm-pack --version)" = "wasm-pack 0.15.0"
      build_command: bun run build:wasm-demo
      artifact_paths: apps/web/src/generated/my_farm_wasm
      reuse_across_runs: true
      artifact_retention_days: 7
      timeout_minutes: 30

  validate-core:
    if: needs.resolve-farm-art-source.outputs.docs_only != 'true'
    needs: resolve-farm-art-source
    name: Core validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: rustfmt

      # Rust compilation dominates this job; reuse its dependency and test
      # outputs across unchanged lockfiles, with Cargo checking source changes.
      - name: Cache Cargo test builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-my-farm-core-rust-1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-my-farm-core-rust-1.99.1-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Verify generated contracts
        run: cargo run -p contract_codegen -- --check

      - name: Test mobile model and UI logic
        run: bun run test:mobile

      # Catch Expo SDK drift: SDK-bound packages that disagree with the
      # installed SDK, type errors, or Metro failing to bundle the app.
      - name: Check mobile Expo SDK alignment
        working-directory: apps/mobile
        run: bunx expo install --check

      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: bun run typecheck

      - name: Bundle mobile app for Android and iOS
        working-directory: apps/mobile
        run: |
          bunx expo export --platform android --output-dir "$RUNNER_TEMP/mobile-export-android"
          bunx expo export --platform ios --output-dir "$RUNNER_TEMP/mobile-export-ios"

      - name: Test authoritative Wheat appearance mapping
        run: bun run test:crop-art

  validate-web:
    if: needs.resolve-farm-art-source.outputs.docs_only != 'true'
    name: Web validation
    needs:
      - resolve-farm-art-source
      - build-farm-art
      - build-wasm-demo
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Consume verified WASM demo
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@5291d5162b128faca9dd83edba24e7342730e604
        with:
          producer_run_id: ${{ needs.build-wasm-demo.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-wasm-demo.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-wasm-demo.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-wasm-demo.outputs.artifact_digest }}
          source_sha: ${{ needs.build-wasm-demo.outputs.source_sha }}
          artifact_key: ${{ needs.build-wasm-demo.outputs.artifact_key }}
          identity_digest: ${{ needs.build-wasm-demo.outputs.identity_digest }}
          destination_path: .artifacts/my-farm-wasm
          github_token: ${{ github.token }}

      - name: Stage verified WASM demo
        run: |
          rm -rf apps/web/src/generated/my_farm_wasm
          mkdir -p apps/web/src/generated/my_farm_wasm
          cp -R .artifacts/my-farm-wasm/. apps/web/src/generated/my_farm_wasm

      - name: Consume verified generated Wheat artwork
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@5291d5162b128faca9dd83edba24e7342730e604
        with:
          producer_run_id: ${{ needs.build-farm-art.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-farm-art.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-farm-art.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-farm-art.outputs.artifact_digest }}
          source_sha: ${{ needs.build-farm-art.outputs.source_sha }}
          artifact_key: ${{ needs.build-farm-art.outputs.artifact_key }}
          identity_digest: ${{ needs.build-farm-art.outputs.identity_digest }}
          destination_path: .artifacts/my-farm-art
          github_token: ${{ github.token }}

      - name: Stage generated Wheat artwork
        run: |
          mkdir -p apps/web/public/farm-art
          cp -R .artifacts/my-farm-art/. apps/web/public/farm-art/
          node scripts/verify-farm-art.mjs

      # PRs target the public Pages runtime; main also verifies the server web build.
      # The main Pages artifact is built independently by pages-build.
      - name: Build web client
        if: ${{ github.event_name != 'pull_request' }}
        run: bun run build:web:prepared

      - name: Build GitHub Pages runtime
        if: ${{ github.event_name == 'pull_request' }}
        run: bun run build:pages:prepared

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Storybook tests
        run: bun run test:storybook

      # Catch regressions in the public journey on PRs, without rerunning the
      # complete browser matrix for each incremental commit. Main and manual
      # validation still run every acceptance test before Pages deployment.
      - name: Run Pages smoke tests without recompiling WASM
        if: ${{ github.event_name == 'pull_request' }}
        env:
          MY_FARM_PREBUILT_WASM: "1"
        run: >-
          bun run test:e2e:pages-demo --grep
          "pages demo runs from WASM without server API calls|pages demo places a House Interior Decoration|the chosen non-default Resident harvests|narrow touch viewport completes the first-minute harvest|Wheat appearance follows planted Crop state"

      - name: Run full Pages demo tests without recompiling WASM
        if: ${{ github.event_name != 'pull_request' }}
        env:
          MY_FARM_PREBUILT_WASM: "1"
        run: bun run test:e2e:pages-demo

      - name: Upload Wheat desktop/mobile visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crop-visual-evidence
          path: apps/web/crop-evidence/
          if-no-files-found: ignore

  validate:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: [resolve-farm-art-source, build-farm-art, build-wasm-demo, validate-core, validate-web]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["resolve-farm-art-source","build-farm-art","build-wasm-demo","validate-core","validate-web"]'
          allow-skipped: ${{ needs.resolve-farm-art-source.outputs.docs_only == 'true' && '["build-farm-art","build-wasm-demo","validate-core","validate-web"]' || '[]' }}

  pages-build:
    name: Build Pages from verified WASM
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    needs:
      - build-wasm-demo
      - build-farm-art
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Consume verified WASM demo
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@5291d5162b128faca9dd83edba24e7342730e604
        with:
          producer_run_id: ${{ needs.build-wasm-demo.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-wasm-demo.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-wasm-demo.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-wasm-demo.outputs.artifact_digest }}
          source_sha: ${{ needs.build-wasm-demo.outputs.source_sha }}
          artifact_key: ${{ needs.build-wasm-demo.outputs.artifact_key }}
          identity_digest: ${{ needs.build-wasm-demo.outputs.identity_digest }}
          destination_path: .artifacts/my-farm-wasm
          github_token: ${{ github.token }}

      - name: Stage verified WASM demo
        run: |
          rm -rf apps/web/src/generated/my_farm_wasm
          mkdir -p apps/web/src/generated/my_farm_wasm
          cp -R .artifacts/my-farm-wasm/. apps/web/src/generated/my_farm_wasm

      - name: Consume verified generated Wheat artwork
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@5291d5162b128faca9dd83edba24e7342730e604
        with:
          producer_run_id: ${{ needs.build-farm-art.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-farm-art.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-farm-art.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-farm-art.outputs.artifact_digest }}
          source_sha: ${{ needs.build-farm-art.outputs.source_sha }}
          artifact_key: ${{ needs.build-farm-art.outputs.artifact_key }}
          identity_digest: ${{ needs.build-farm-art.outputs.identity_digest }}
          destination_path: .artifacts/my-farm-art
          github_token: ${{ github.token }}

      - name: Stage generated Wheat artwork
        run: |
          mkdir -p apps/web/public/farm-art
          cp -R .artifacts/my-farm-art/. apps/web/public/farm-art/
          node scripts/verify-farm-art.mjs

      - name: Build Pages demo without recompiling WASM
        run: bun run build:pages:prepared

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/web/dist

  deploy-pages:
    name: Deploy GitHub Pages
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    needs:
      - validate
      - pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
